{% extends "base.html" %}

{% block title %}Overview - Energy Tracker{% endblock %}

{% block content %}
<div class="stat-cards" id="stats">
    <div class="stat-card">
        <h3>Total Days Tracked</h3>
        <div class="value" id="total-days">-</div>
    </div>
    <div class="stat-card">
        <h3>Fog Days</h3>
        <div class="value" id="fog-days">-</div>
    </div>
    <div class="stat-card">
        <h3>Fog Percentage</h3>
        <div class="value" id="fog-pct">-</div>
    </div>
    <div class="stat-card">
        <h3>Current Clear Streak</h3>
        <div class="value" id="clear-streak">-</div>
    </div>
</div>

<div class="chart-container">
    <h2>Top 3 Correlates</h2>
    <div class="habit-selector">
        <span class="habit-selector-indicator"></span>
        <span class="habit-selector-label">Analyze habit</span>
        <select id="target-habit" onchange="loadCorrelations()">
            <option value="">Loading habits...</option>
        </select>
    </div>
    <div id="top-correlates">
        <p class="loading">Select a habit to see correlations</p>
    </div>
</div>

<script src="/static/js/overview.js"></script>
{% endblock %}
